name: Proxy Monitor

on:
  schedule:
    # ~every 10 min, offset from the top of the hour (GitHub cron is best-effort).
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      test_type:
        description: "Which test to run"
        type: choice
        default: quick
        options: [quick, session, concurrency, streaming]

# Avoid overlapping runs racing on the same data files / git push.
concurrency:
  group: proxy-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Worst-case legitimate runs (slow proxy, full timeouts on both protocols) take a few
    # minutes; this just stops a genuine hang from blocking cron checks indefinitely.
    timeout-minutes: 15
    env:
      PROXY_HOST: ${{ secrets.PROXY_HOST }}
      PROXY_HTTP_PORT: ${{ secrets.PROXY_HTTP_PORT }}
      PROXY_SOCKS_PORT: ${{ secrets.PROXY_SOCKS_PORT }}
      PROXY_USER: ${{ secrets.PROXY_USER }}
      PROXY_PASS: ${{ secrets.PROXY_PASS }}
      PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate page lock hash
        run: |
          mkdir -p docs/data
          if [ -n "$PAGE_PASSWORD" ]; then
            hash=$(printf '%s' "$PAGE_PASSWORD" | sha256sum | cut -d' ' -f1)
            printf '{"hash":"%s"}\n' "$hash" > docs/data/lock-hash.json
          else
            printf '{"hash":null}\n' > docs/data/lock-hash.json
          fi

      - name: Run proxy test (${{ github.event.inputs.test_type || 'quick' }})
        run: bash scripts/monitor.sh "${{ github.event.inputs.test_type || 'quick' }}"

      - name: Commit results
        run: |
          git config user.name  "proxy-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "monitor: ${{ github.event.inputs.test_type || 'quick' }} @ $(date -u +%FT%TZ)"
            # Rebase onto any concurrent commits before pushing.
            for i in 1 2 3 4; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "push retry $i"; sleep $((2**i))
            done
          fi
